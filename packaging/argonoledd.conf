[oled]
# Seconds each screen is displayed, and how long a MESSAGE is shown
screenduration = 3

# Space-separated list of screens in display order
# Valid names: clock cpu storage bandwidth raid ram temp ip
screenlist = clock cpu storage bandwidth raid ram temp ip

# Temperature unit: C or F
temperature = C

[socket]
# Socket path (default shown, change only if needed)
# path = /run/argonoledd.sock
